name: AllergyLab CI/CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}
          
      - name: Build and push app
        uses: docker/build-push-action@v5
        with:
          context: ./Part5/app
          push: true
          tags: chindris-mihai-alexandru/part5-app:latest
          
      - name: Build and push db-loader
        uses: docker/build-push-action@v5
        with:
          context: ./Part5/db-loader
          push: true
          tags: chindris-mihai-alexandru/part5-db-loader:latest
          
      - name: Build and push email
        uses: docker/build-push-action@v5
        with:
          context: ./Part5/email
          push: true
          tags: chindris-mihai-alexandru/part5-email:latest